# Blueprint Render : https://render.com/docs/blueprint-spec
# Permet un déploiement en un clic ("New +" → "Blueprint", pointer sur ce
# repo) sans configurer manuellement le service dans l'interface.
services:
  - type: web
    name: manga-quoting
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: PYTHON_VERSION
        value: "3.12.7"
